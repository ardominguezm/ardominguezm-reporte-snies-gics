
<style>
  .tab-btn { background: transparent; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--color-text-secondary); }
  .tab-btn.active { background: #1F3864; color: #fff; border-color: #1F3864; }
  .metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 16px; }
  .metric .val { font-size: 22px; font-weight: 500; }
  .metric .lbl { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
</style>

<div style="padding: 1rem 0;">

<p style="font-size: 13px; color: var(--color-text-secondary); margin: 0 0 1rem;">SNIES · marzo 2026 &nbsp;|&nbsp; 8 programas tecnológicos en logística / cadena de suministro</p>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 1.5rem;">
  <div class="metric"><div class="lbl">Total matriculados 2024-1</div><div class="val" style="color:#2E75B6;">3 499</div></div>
  <div class="metric"><div class="lbl">Total matriculados 2024-2</div><div class="val" style="color:#2E75B6;">3 220</div></div>
  <div class="metric"><div class="lbl">Valor matrícula promedio</div><div class="val" style="color:#C9A84C;">$2 490 K</div></div>
  <div class="metric"><div class="lbl">Ciudades representadas</div><div class="val" style="color:#1F3864;">4</div></div>
</div>

<div style="display: flex; gap: 8px; margin-bottom: 1.25rem;">
  <button class="tab-btn active" onclick="showTab('matr',this)">Matriculados por período</button>
  <button class="tab-btn" onclick="showTab('adm',this)">Admitidos por período</button>
  <button class="tab-btn" onclick="showTab('costo',this)">Valor de matrícula</button>
  <button class="tab-btn" onclick="showTab('modal',this)">Modalidad</button>
</div>

<div id="tab-matr">
  <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; font-size: 12px; color: var(--color-text-secondary);">
    <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#1F3864;"></span>2023-1</span>
    <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#2E75B6;"></span>2023-2</span>
    <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#85B7EB;"></span>2024-1</span>
    <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#C9A84C;"></span>2024-2</span>
  </div>
  <div style="position:relative;width:100%;height:320px;"><canvas id="cMatr"></canvas></div>
</div>

<div id="tab-adm" style="display:none;">
  <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; font-size: 12px; color: var(--color-text-secondary);">
    <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#1F3864;"></span>2023-1</span>
    <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#2E75B6;"></span>2023-2</span>
    <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#85B7EB;"></span>2024-1</span>
    <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#C9A84C;"></span>2024-2</span>
  </div>
  <div style="position:relative;width:100%;height:320px;"><canvas id="cAdm"></canvas></div>
</div>

<div id="tab-costo" style="display:none;">
  <div style="position:relative;width:100%;height:380px;"><canvas id="cCosto"></canvas></div>
</div>

<div id="tab-modal" style="display:none;">
  <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-top:1rem;">
    <div style="position:relative;width:220px;height:220px;flex-shrink:0;"><canvas id="cModal"></canvas></div>
    <div id="modal-legend" style="font-size:13px;line-height:1.9;color:var(--color-text-primary);"></div>
  </div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const inst = ["Pol. Grancolombiano","UNAD","CET Colsubsidio","Pol. Jaime Isaza","IU Pascual Bravo","FCECEP Cali","Pol. Costa Atlántica","Corp. Tec. Indoamérica"];

const matr = {
  "2023-1": [654, 9, 29, 28, 35, 10, 28, 23],
  "2023-2": [563, 4, 0, 23, 48, 0, 27, 11],
  "2024-1": [3031, 63, 54, 59, 127, 14, 85, 67],
  "2024-2": [2813, 35, 43, 86, 124, 12, 80, 70]
};
const adm = {
  "2023-1": [1033,19,29,37,45,10,27,23],
  "2023-2": [908,13,0,26,83,3,27,11],
  "2024-1": [909,13,9,16,23,9,22,23],
  "2024-2": [645,12,11,15,69,1,18,15]
};
const costos = [2439000,2535000,2372600,1900000,2626400,2650000,3132750,2264600];
const modalidad = ["Virtual","Virtual","Presencial","Presencial","Pres.-Virtual","Presencial","Presencial","Presencial"];

const COLORS = ['#1F3864','#2E75B6','#85B7EB','#C9A84C'];
const opts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 11 }, autoSkip: false, maxRotation: 30 } }, y: { ticks: { font: { size: 11 } } } } };

function makeGrouped(canvasId, data) {
  const periods = Object.keys(data);
  new Chart(document.getElementById(canvasId), {
    type: 'bar',
    data: {
      labels: inst,
      datasets: periods.map((p,i) => ({ label: p, data: data[p], backgroundColor: COLORS[i], borderRadius: 3 }))
    },
    options: { ...opts, plugins: { ...opts.plugins } }
  });
}

makeGrouped('cMatr', matr);
makeGrouped('cAdm', adm);

new Chart(document.getElementById('cCosto'), {
  type: 'bar',
  indexAxis: 'y',
  data: {
    labels: inst,
    datasets: [{ label: 'Valor matrícula', data: costos, backgroundColor: '#2E75B6', borderRadius: 3 }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => '$' + ctx.raw.toLocaleString('es-CO') } } },
    scales: {
      x: { ticks: { font:{size:11}, callback: v => '$' + (v/1000).toFixed(0) + 'K' } },
      y: { ticks: { font:{size:11} } }
    }
  }
});

const modalCount = {};
modalidad.forEach(m => modalCount[m] = (modalCount[m]||0)+1);
const mLabels = Object.keys(modalCount);
const mData = mLabels.map(k => modalCount[k]);
const mColors = ['#1F3864','#2E75B6','#85B7EB','#C9A84C'];
new Chart(document.getElementById('cModal'), {
  type: 'doughnut',
  data: { labels: mLabels, datasets: [{ data: mData, backgroundColor: mColors, borderWidth: 2 }] },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
});
const leg = document.getElementById('modal-legend');
mLabels.forEach((l,i) => {
  leg.innerHTML += `<div style="display:flex;align-items:center;gap:8px;"><span style="width:12px;height:12px;border-radius:2px;background:${mColors[i]};flex-shrink:0;"></span><span><strong>${l}</strong> — ${mData[i]} programa${mData[i]>1?'s':''}</span></div>`;
});

function showTab(id, btn) {
  ['matr','adm','costo','modal'].forEach(t => document.getElementById('tab-'+t).style.display = 'none');
  document.getElementById('tab-'+id).style.display = '';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
